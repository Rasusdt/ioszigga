name: iOS unsigned IPA

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"
      - "ios/**"
      - "zigga-ios.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          set -euo pipefail
          if [ ! -f ios/project.yml ] || [ ! -f ios/ZIGGA/Assets.xcassets/AppIcon.appiconset/icon-1024.png ]; then
            unzip -qn zigga-ios.zip -x ".github/*" -d .
          fi
          echo "--- ios ---"; ls ios
          echo "--- icon ---"; ls -la ios/ZIGGA/Assets.xcassets/AppIcon.appiconset || true

      - name: Show Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch AmneziaWG core
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.4 https://github.com/amnezia-vpn/amneziawg-apple.git ios/Vendor/amneziawg-apple

      - name: Build libwg-go.a
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make -C ios/Vendor/amneziawg-apple/Sources/WireGuardKitGo build \
            PLATFORM_NAME=iphoneos ARCHS=arm64 SDKROOT="$SDKROOT"
          ls -la ios/Vendor/amneziawg-apple/Sources/WireGuardKitGo/out

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project ZIGGA.xcodeproj \
            -scheme ZIGGA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP=$APP"
          rm -rf ios/out
          mkdir -p ios/out/Payload
          cp -R "$APP" ios/out/Payload/
          cd ios/out
          zip -qry ZIGGA-unsigned.ipa Payload
          shasum -a 256 ZIGGA-unsigned.ipa | tee ZIGGA-unsigned.ipa.sha256
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIGGA-unsigned-ipa
          path: |
            ios/out/ZIGGA-unsigned.ipa
            ios/out/ZIGGA-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ios/build/Logs
          if-no-files-found: ignore
